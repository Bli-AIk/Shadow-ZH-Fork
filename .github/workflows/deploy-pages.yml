name: Deploy GitHub Pages

on:
  push:
    branches:
      - feat/zh-support
  schedule:
    # 每日 04:37 UTC（约 12:37 北京）重建，让页脚的上游哈希保持新鲜。
    # 注意：schedule 只读取默认分支（feat/zh-support）上的本文件。
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量历史：upstream-sync 需要根据 sync-state.json 的对齐 commit 计算落后数
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /Shadow-ZH-Fork
          BASE_URL: https://bli-aik.github.io/Shadow-ZH-Fork

      - name: Prepare Pages root
        run: |
          cp out/en/index.html out/index.html
          touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
